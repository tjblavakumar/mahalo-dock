services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "8008:8008"
    environment:
      # Persist the SQLite DB in the mounted volume so users/data survive
      # container recreation. Hardcoded (no ${..} substitution) so a stale
      # DATABASE_URL exported in the host shell can't override it.
      - DATABASE_URL=sqlite:////app/data/mahalo3.db
      - JWT_SECRET_KEY=${JWT_SECRET_KEY:-dev-secret-key-change-me}
      - JWT_ALGORITHM=HS256
      - JWT_EXPIRATION_MINUTES=60
      # Allow the frontend origin. Defaults cover both the standard port (3000)
      # and the common alternate (3010); override via CORS_ORIGINS in .env
      # (comma-separated) if you expose the frontend on a different port/host.
      - CORS_ORIGINS=${CORS_ORIGINS:-http://localhost:3000,http://localhost:3010}
      # LLM configuration (sourced from .env). The orchestrator needs these to
      # reach the right provider/model; without them it falls back to code
      # defaults and ignores your .env.
      # LLM_PROVIDER: openrouter | openai | bedrock
      - LLM_PROVIDER=${LLM_PROVIDER:-openrouter}
      - ORCHESTRATOR_MODEL=${ORCHESTRATOR_MODEL:-gpt-4o}
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - OPENAI_BASE_URL=${OPENAI_BASE_URL:-https://api.openai.com/v1}
      - SYNTHESIS_PROVIDER=${SYNTHESIS_PROVIDER:-onemin}
      - SYNTHESIS_MODEL=${SYNTHESIS_MODEL:-gpt-4o}
      - ONEMIN_API_KEY=${ONEMIN_API_KEY:-}
      - ONEMIN_BASE_URL=${ONEMIN_BASE_URL:-https://api.1min.ai}
      # Amazon Bedrock (used when LLM_PROVIDER/SYNTHESIS_PROVIDER=bedrock).
      # No API key: boto3 resolves creds from the standard AWS chain. On a host
      # with a ~/.aws profile (e.g. the AWS WorkSpace), the volume mount below
      # exposes it to the container; AWS_PROFILE/AWS_REGION select it.
      - BEDROCK_REGION=${BEDROCK_REGION:-us-east-1}
      - BEDROCK_ORCHESTRATOR_MODEL=${BEDROCK_ORCHESTRATOR_MODEL:-anthropic.claude-3-5-sonnet-20240620-v1:0}
      - BEDROCK_SYNTHESIS_MODEL=${BEDROCK_SYNTHESIS_MODEL:-anthropic.claude-3-5-sonnet-20240620-v1:0}
      - AWS_REGION=${AWS_REGION:-${BEDROCK_REGION:-us-east-1}}
      - AWS_PROFILE=${AWS_PROFILE:-}
      - MOCK_JIRA_URL=http://mock-jira:5001
      - MOCK_CONFLUENCE_URL=http://mock-confluence:5002
      - MOCK_GITHUB_URL=http://mock-github:5003
      - MOCK_SERVICENOW_URL=http://mock-servicenow:5004
    volumes:
      - backend-data:/app/data
      # NOTE: Bedrock mode (LLM_PROVIDER=bedrock) needs AWS credentials in the
      # container. That's added via the opt-in override docker-compose.bedrock.yml
      # (mounts your ~/.aws read-only), so the base stack stays free of a bind
      # mount that may not exist on every host.
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8008/health"]
      interval: 10s
      timeout: 5s
      retries: 3
    depends_on: []

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      # Host port is configurable (FRONTEND_PORT) to avoid clashes with a local
      # dev server already on 3000. Container always listens on 3000.
      - "${FRONTEND_PORT:-3000}:3000"
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:8008
    depends_on:
      - backend

  mock-jira:
    build:
      context: ./mock-services/jira
      dockerfile: Dockerfile
    ports:
      - "5001:5001"
    environment:
      - MOCK_JIRA_TOKEN=${MOCK_JIRA_TOKEN:-mock-jira-token-12345}
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5001/health"]
      interval: 10s
      timeout: 5s
      retries: 3

  mock-confluence:
    build:
      context: ./mock-services/confluence
      dockerfile: Dockerfile
    ports:
      - "5002:5002"
    environment:
      - MOCK_CONFLUENCE_TOKEN=${MOCK_CONFLUENCE_TOKEN:-mock-confluence-token-12345}
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5002/health"]
      interval: 10s
      timeout: 5s
      retries: 3

  # GitHub adapter. Preserves the original mock-GitHub contract on :5003 with
  # X-API-Token auth. GITHUB_MODE selects the backend:
  #   real (default) → backed by the self-hosted Gitea service
  #   mock           → original in-memory JSON store (fully offline)
  # In real mode it reads the bootstrap-generated token from the shared
  # gitea-bootstrap volume (GITEA_TOKEN_FILE) and waits for Gitea to be healthy
  # and the bootstrap to complete.
  mock-github:
    build:
      context: ./mock-services/github
      dockerfile: Dockerfile
    ports:
      - "5003:5003"
    environment:
      - MOCK_GITHUB_TOKEN=${MOCK_GITHUB_TOKEN:-mock-github-token-12345}
      - GITHUB_MODE=${GITHUB_MODE:-real}
      - GITEA_URL=http://gitea:3000
      - GITEA_ADMIN_USER=${GITEA_ADMIN_USER:-mahalo_admin}
      - GITEA_PUBLIC_URL=${GITEA_PUBLIC_URL:-http://localhost:3001}
      - GITEA_TOKEN_FILE=/bootstrap/gitea_token
    volumes:
      # Read-only access to the bootstrap token written by gitea-bootstrap.
      - gitea-bootstrap:/bootstrap:ro
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5003/health"]
      interval: 10s
      timeout: 5s
      retries: 3
    depends_on:
      gitea:
        condition: service_healthy
      gitea-bootstrap:
        condition: service_completed_successfully

  mock-servicenow:
    build:
      context: ./mock-services/servicenow
      dockerfile: Dockerfile
    ports:
      - "5004:5004"
    environment:
      - MOCK_SERVICENOW_TOKEN=${MOCK_SERVICENOW_TOKEN:-mock-servicenow-token-12345}
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5004/health"]
      interval: 10s
      timeout: 5s
      retries: 3

  # Self-hosted Git server. In GITHUB_MODE=real the github adapter is backed by
  # this service (reachable in-stack at http://gitea:3000). Web UI is exposed on
  # the host at :3001. Data persists in the gitea-data named volume.
  gitea:
    image: gitea/gitea:1.27.3
    ports:
      # Web UI / REST API (host:container). Container always listens on 3000.
      - "3001:3000"
    environment:
      - USER_UID=1000
      - USER_GID=1000
      # First-run configuration (writes app.ini, skips the web installer).
      - GITEA__security__INSTALL_LOCK=true
      - GITEA__server__DOMAIN=${GITEA_DOMAIN:-localhost}
      - GITEA__server__HTTP_PORT=3000
      # ROOT_URL must reflect the host-exposed port so links in the UI resolve.
      - GITEA__server__ROOT_URL=${GITEA_ROOT_URL:-http://localhost:3001/}
      - GITEA__server__SSH_DOMAIN=${GITEA_DOMAIN:-localhost}
      - GITEA__server__START_SSH_SERVER=false
      - GITEA__service__DISABLE_REGISTRATION=true
      - GITEA__service__REQUIRE_SIGNIN_VIEW=false
      - GITEA__openid__ENABLE_OPENID_SIGNIN=false
      - GITEA__database__DB_TYPE=sqlite3
    volumes:
      - gitea-data:/data
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:3000/api/healthz"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  # One-shot provisioning for Gitea: creates an admin user (CLI), an API token,
  # and a seeded sample repo with real files. Built FROM the gitea image so the
  # `gitea` CLI + shared /data volume are available (the first admin can only be
  # made via the CLI). Idempotent: safe to re-run. Exits when done.
  gitea-bootstrap:
    build:
      context: ./mock-services/gitea-bootstrap
      dockerfile: Dockerfile
      args:
        GITEA_VERSION: "1.27.3"
    environment:
      - GITEA_URL=http://gitea:3000
      - GITEA_ADMIN_USER=${GITEA_ADMIN_USER:-mahalo_admin}
      - GITEA_ADMIN_PASSWORD=${GITEA_ADMIN_PASSWORD:-MahaloDock123!}
      - GITEA_ADMIN_EMAIL=${GITEA_ADMIN_EMAIL:-admin@mahalo.local}
      - GITEA_TOKEN_NAME=${GITEA_TOKEN_NAME:-mahalo-adapter}
      - GITEA_SEED_REPO=${GITEA_SEED_REPO:-payment-service}
      - GITEA_TOKEN_FILE=/bootstrap/gitea_token
    volumes:
      # Shared with the server so the CLI can read the same config/data.
      - gitea-data:/data
      # Where the generated adapter token is persisted for the github adapter.
      - gitea-bootstrap:/bootstrap
    depends_on:
      gitea:
        condition: service_healthy
    restart: "no"

volumes:
  backend-data:
  gitea-data:
  gitea-bootstrap:
