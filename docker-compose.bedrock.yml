# Bedrock override (INSTANCE-ROLE DEFAULT): run the backend's LLM on Amazon
# Bedrock using whatever AWS credentials boto3's standard chain resolves.
#
# This file is the default Bedrock layer for EVERY host. It flips the provider
# switches ONLY (LLM_PROVIDER/SYNTHESIS_PROVIDER=bedrock). It deliberately sets
# NO AWS_PROFILE and mounts NO ~/.aws directory, so:
#   - On EC2 the backend uses the instance role via boto3's standard credential
#     chain. Nothing injects an empty AWS_PROFILE (an empty profile is the bug
#     that produced "The config profile () could not be found"), and there is no
#     ~/.aws bind mount to break instance-role hosts that have no ~/.aws.
#   - All other Bedrock env (BEDROCK_REGION, BEDROCK_*_MODEL, timeouts,
#     AWS_REGION) is already wired in the base docker-compose.yml and sourced
#     from .env, so this layer stays minimal.
#
# Usage
#   Instance-role default (EC2, and anywhere boto3's chain resolves creds):
#     docker compose -f docker-compose.yml -f docker-compose.bedrock.yml up -d
#
#   Named-profile case (e.g. the AWS WorkSpace, where creds live in ~/.aws under
#   a named profile): ALSO layer the opt-in docker-compose.bedrock-profile.yml,
#   which adds the ~/.aws mount and a NON-EMPTY AWS_PROFILE:
#     $env:AWS_PROFILE = "lava"
#     docker compose -f docker-compose.yml -f docker-compose.bedrock.yml `
#       -f docker-compose.bedrock-profile.yml up -d
services:
  backend:
    environment:
      - LLM_PROVIDER=bedrock
      - SYNTHESIS_PROVIDER=bedrock
